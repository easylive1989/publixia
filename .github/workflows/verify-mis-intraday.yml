name: Verify TWSE MIS intraday source

# 暫時性的探針：本機沙箱連不到 mis.twse.com.tw（proxy 403），所以借 Actions
# runner 的網路，讓修好的 core/twse_intraday.py 真的對一次活的 MIS。
# 驗完就刪，不留在 repo 裡 —— 依賴外部網路的 job 留著只會無故變紅。

on:
  push:
    branches:
      - 'claude/**'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install -r backend/requirements.txt

      - name: fetch_snapshot against live MIS
        working-directory: backend
        run: |
          python - <<'PY'
          from datetime import datetime
          import pytz

          from core.twse_intraday import fetch_snapshot
          from services.intraday_heat import extrapolate_turnover, _snapshot_time

          today = datetime.now(pytz.timezone("Asia/Taipei")).date()
          print("TST today:", today)

          snap = fetch_snapshot(today)
          print("snapshot:", snap)

          at = _snapshot_time(snap)
          est = snap.turnover if snap.is_final else extrapolate_turnover(snap.turnover, at)
          print(f"累計 {snap.turnover:,.1f} 億 @ {at} → 全日估計 {est:,.1f} 億")

          assert snap.date == today.isoformat(), snap
          assert 10 < snap.turnover < 100_000, snap
          assert 1_000 < snap.taiex < 1_000_000, snap
          print("OK")
          PY
